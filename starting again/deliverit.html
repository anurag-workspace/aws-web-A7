<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deliverit - Everything you need deliver in minutes</title>
  <link rel="stylesheet" href="delivery style.css">
</head>
<body>
  
  <header>
    <h1>Deliverit</h1>
  </header>

  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Groceries</a></li>
      <li><a href="#">Fruits</a></li>
      <li><a href="#">Vegetables</a></li>
      <li><a href="#">Snacks</a></li>
      
    </ul>
  </nav>


  <section class="banner">
    <h2>Welcome to Deliverit</h2>
    <p>Your groceries delivered fast and fresh</p>
  </section>

  
  <section class="products">
    <h2>Featured Products</h2>
    <div class="product-card">
      <img src="https://m.media-amazon.com/images/I/812816L+HkL.jpg" alt="Milk">
      <h3>Fresh Milk</h3>
      <p>₹50 / litre</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://img.magnific.com/premium-photo/freshly-packed-apples-transparent-delight-with-paper-label_983420-27758.jpg?w=996" alt="Apples">
      <h3>Red Apples</h3>
      <p>₹120 / kg</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://www.britannia.co.in/_next/image?url=https:%2F%2Fd22qhov8mohr82.cloudfront.net%2F990198_BRITANNIA_100_WHOLE_WHEAT_BREAD_450_G_LR_1_640675e2f4.png&w=1920&q=100" alt="Bread">
      <h3>Wheat Bread</h3>
      <p>₹40 / pack</p>
      <button>Add to Cart</button>
    </div>




    <div class="product-card">
      <img src="https://m.media-amazon.com/images/I/61duEBwvXdL._SL1500_.jpg" alt="butter">
      <h3>Butter</h3>
      <p>₹50 / pack</p>
      <button>Add to Cart</button>
    </div>
  </section>


  <footer>
    <p>&copy; 2026 Deliverit. All rights reserved</p>
  </footer>
</body>
</html>
