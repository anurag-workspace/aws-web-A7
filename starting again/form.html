<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 style="text-align: center;">Fill the form carefully</h2><hr>
    <form autocomplete="on" style="text-align: center;">
        <label>Name : </label>
        <input type ="text" placeholder="Enter your name">
        <br><br>
        <label>Email : </label>
        <input type ="text" placeholder="Enter your email">
        <br><br>
        <label>Age : </label>
        <input type ="number" placeholder="Enter your age">
        <br><br>
        <label>Gender : </label>
        <input type ="radio" name="Gender" value="Male"> Male
        <input type ="radio" name="Gender" value="Female"> Female
        <br><br>

        <label>Hobbies : </label>
        <input type ="checkbox" name="hobby" value="reading">Reading
        <input type ="checkbox" name="hobby" value="Cooking">Cooking
        <input type ="checkbox" name="hobby" value="Playing">Playing
        <input type ="checkbox" name="hobby" value="Traveling">Traveling
        
        <br><br>
        <label>
            Date of birth: 
        </label>
        <input type="date"> <br> <br>
        <label>favourite color : </label>
        <input type="color"><br><br>


         <label>linkedin Profile : </label>
        <input type ="url" placeholder="Enter your linkedin">
        <br><br>
        <label>Country : </label>
        <select>
            <option value="India">India</option>
            <option value="australia">Australia</option>
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uae">UAE</option>
        </select>





    </form>
</body>
</html>
